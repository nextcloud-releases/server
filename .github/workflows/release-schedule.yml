# Keeps release-schedule.json ahead of the releases that read it.
#
# Takes no tag. It works out which majors are still inside their 12-month
# maintenance window and the highest version tagged for each, candidates
# included, then makes sure the next two patch milestones of every one of them
# has a date and drops entries for rounds that have shipped. That makes it
# idempotent: running it twice, or a week late, converges on the same file.
#
# Runs on every release candidate, roughly a week before the stable release it
# precedes, and weekly as a backstop because a candidate can be skipped. It
# never fails the release: a candidate needs no due dates of its own, and a red
# job a week out only teaches people to ignore it.
#
# The dates come from the committed cadence, which is a default and not the
# authority, so the pull request exists to be checked against the wiki rather
# than merged blind.

name: Update release schedule

on:
  # Called from release.yml on release candidates
  workflow_call:
  # Backstop, in case a round shipped without a candidate
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: report what would change, open no pull request'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-schedule
  cancel-in-progress: false

jobs:
  schedule:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    env:
      # RELEASE_TOKEN can open pull requests; GITHUB_TOKEN is the fallback.
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      BRANCH: chore/release-schedule

    steps:
      - name: Checkout config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install release-tools
        run: composer install --no-interaction --no-progress --no-dev
        working-directory: tools/release

      - name: Work out the dates the next releases will need
        id: extend
        run: |
          php tools/release/bin/console schedule:extend release-schedule.json --write
          if git diff --quiet -- release-schedule.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff -- release-schedule.json
          fi

      # One branch, always rebuilt from the default branch: the command is
      # idempotent, so the newest run is always the whole answer.
      - name: Open or update the pull request
        if: steps.extend.outputs.changed == 'true' && inputs.dry_run != true
        run: |
          git config user.name "nextcloud-bot"
          git config user.email "bot@nextcloud.com"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git checkout -B "$BRANCH"
          git add release-schedule.json
          git commit --signoff -m "chore: schedule the next maintenance rounds"
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Pull request for $BRANCH is already open and has been updated."
            exit 0
          fi

          {
            echo "\`release-schedule.json\` is short of the dates the next releases need. The milestones step requires a date for the next patch milestone of the series being released, and fails on release day without one, leaving the released milestone open and its issues unmoved."
            echo
            echo "This keeps two future rounds dated for every major still inside its 12-month maintenance window, and drops entries for rounds that have shipped."
            echo
            echo "> [!IMPORTANT]"
            echo "> These dates come from the cadence documented in the README: a Thursday, one per calendar month, four weeks on and five when four would land twice in one month. **They are not read from the wiki.** Check them against the wiki release schedule before merging and edit this pull request wherever they differ."
            echo
            echo "Entries that already had a date were left alone, so a correction made by hand survives. Nothing is scheduled past a major's maintenance window."
          } > pr-body.md

          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "chore: schedule the next maintenance rounds" \
            --body-file pr-body.md
