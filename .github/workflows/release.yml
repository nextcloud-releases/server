name: Release pipeline
run-name: "Release ${{ inputs.tag }}"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v34.0.1)'
        required: true

jobs:
  # Stops a stable release before anything is tagged when release-schedule.json
  # is not ready for it, instead of failing the milestone update after the
  # release has shipped. Pre-releases pass straight through.
  preflight:
    if: startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          tools: composer

      - name: Install release-tools
        run: composer install --no-interaction --no-progress --no-dev
        working-directory: tools/release

      - name: Check the release schedule
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: php tools/release/bin/console schedule:check "$TAG" release-schedule.json

  tag:
    needs: preflight
    if: startsWith(inputs.tag, 'v')
    uses: ./.github/workflows/release-tag.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit

  changelog:
    needs: tag
    if: startsWith(inputs.tag, 'v')
    uses: ./.github/workflows/release-changelog.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit

  build:
    needs: [tag, changelog]
    if: startsWith(inputs.tag, 'v')
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit

  updater:
    needs: build
    if: startsWith(inputs.tag, 'v')
    uses: ./.github/workflows/release-updater.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit

  # Runs after tagging a release candidate, roughly a week before the stable
  # release it precedes. Proposes the schedule entries that release will need,
  # as a pull request; never blocks the candidate.
  schedule:
    needs: tag
    if: startsWith(inputs.tag, 'v') && contains(inputs.tag, 'rc')
    uses: ./.github/workflows/release-schedule.yml
    secrets: inherit

  # Runs after tagging completes. Only for stable releases and first betas.
  # Runs in parallel with changelog and build.
  milestones:
    needs: tag
    if: >-
      startsWith(inputs.tag, 'v')
      && (
        (!contains(inputs.tag, 'alpha') && !contains(inputs.tag, 'beta') && !contains(inputs.tag, 'rc'))
        || endsWith(inputs.tag, 'beta1')
      )
    uses: ./.github/workflows/release-milestones.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit

  # Single pass/fail for the whole pipeline. Milestones and Schedule each skip
  # depending on the release shape, so a skip must not count as a failure.
  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [preflight, tag, changelog, build, updater, schedule, milestones]

    if: always()

    name: release-summary

    steps:
      - name: Summary status
        run: if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then exit 1; fi

