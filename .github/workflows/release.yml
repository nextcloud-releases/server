name: Release pipeline
run-name: "Release ${{ inputs.tag }}"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to release, e.g. 35.0.4'
        required: true
      dry_run:
        description: 'Only run the preflight checks'
        type: boolean
        default: false
      force:
        description: 'Redo an existing release on a new commit (refused once updater_server production lists it)'
        type: boolean
        default: false

jobs:
  # Refuses a release before anything is tagged: version format, config JSON,
  # existing tags, version.php and release-schedule.json. Until the pipeline
  # tags on its own (PIPELINE_PUBLISHES), the legacy script dispatches with a
  # leading v after tagging, so both are accepted then.
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          tools: composer

      - name: Install release-tools
        run: composer install --no-interaction --no-progress --no-dev
        working-directory: tools/release

      - name: Preflight checks
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.tag }}
          SHADOW: ${{ vars.PIPELINE_PUBLISHES != 'true' && '--shadow' || '' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          # shellcheck disable=SC2086 # SHADOW and FORCE are one flag or nothing
          php tools/release/bin/console release:preflight "$VERSION" $SHADOW $FORCE

  # The single human gate: the release team (not whoever dispatched) approves
  # through the release environment, then everything below runs on its own.
  # Off while the legacy script dispatches every release (PIPELINE_PUBLISHES).
  approve:
    needs: preflight
    if: ${{ !inputs.dry_run && vars.PIPELINE_PUBLISHES == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - name: Approved
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: echo "::notice::${TAG} approved"

  # A forced redo of a release the pipeline published: after approval, check
  # updater_server production again (approval can take hours), then withdraw
  # the GitHub release and the updater pull request so the run recreates them.
  # The legacy script owns both until PIPELINE_PUBLISHES.
  cleanup:
    needs: [preflight, approve]
    if: ${{ inputs.force && vars.PIPELINE_PUBLISHES == 'true' && needs.approve.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          tools: composer

      - name: Install release-tools
        run: composer install --no-interaction --no-progress --no-dev
        working-directory: tools/release

      - name: Check again that servers were never offered it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.tag }}
        run: php tools/release/bin/console release:preflight "$VERSION" --force

      - name: Withdraw the GitHub release and the updater pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The tag stays; the tag job moves it to the new commit.
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            echo "::notice::Deleted release ${TAG}"
          fi
          PR=$(gh pr list --repo nextcloud-releases/updater_server --head "releases/${VERSION}" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            gh pr close "$PR" --repo nextcloud-releases/updater_server --delete-branch \
              --comment "Superseded by a forced redo of ${TAG}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "::notice::Closed updater_server#${PR}"
          fi

  tag:
    needs: [preflight, approve, cleanup]
    if: >-
      always() && !inputs.dry_run
      && needs.preflight.result == 'success'
      && (needs.approve.result == 'success' || needs.approve.result == 'skipped')
      && (needs.cleanup.result == 'success' || needs.cleanup.result == 'skipped')
    uses: ./.github/workflows/release-tag.yml
    with:
      tag: ${{ needs.preflight.outputs.tag }}
      force: ${{ inputs.force }}
      # Server tags only move on a forced redo of a release the pipeline owns.
      retag_protected: ${{ inputs.force && vars.PIPELINE_PUBLISHES == 'true' }}
    secrets: inherit

  # Creates the GitHub release as a draft right after tagging, so the
  # changelog and the build fill it before anyone can see it. Until
  # PIPELINE_PUBLISHES the legacy script creates the release itself.
  draft:
    needs: [preflight, tag]
    if: ${{ vars.PIPELINE_PUBLISHES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          # A re-run finds the draft from the run before and keeps it.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release ${TAG} already exists"
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "$TAG" --notes ""

  changelog:
    needs: [preflight, tag, draft]
    if: >-
      always() && needs.tag.result == 'success'
      && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    uses: ./.github/workflows/release-changelog.yml
    with:
      tag: ${{ needs.preflight.outputs.tag }}
    secrets: inherit

  build:
    needs: [preflight, tag, changelog]
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.preflight.outputs.tag }}
    secrets: inherit

  # Attaches the build to the draft and publishes it, then mirrors a pointer
  # release on nextcloud/server. Until PIPELINE_PUBLISHES the legacy script
  # does both with its own build.
  publish:
    needs: [preflight, build]
    if: ${{ vars.PIPELINE_PUBLISHES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: releases

      - name: Attach the build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          gh release upload "$TAG" releases/* --repo "$GITHUB_REPOSITORY" --clobber

          # Same rule as the release script: pre-releases are marked as such,
          # and only the newest stable major (master's minus one) is latest.
          MAJOR="${TAG#v}"; MAJOR="${MAJOR%%.*}"
          # shellcheck disable=SC2016 # literal $OC_Version
          MASTER=$(curl -sf https://raw.githubusercontent.com/nextcloud/server/refs/heads/master/version.php \
            | grep -oP '\$OC_Version\s*=\s*\[\K[0-9]+')
          if [[ "$TAG" =~ (alpha|beta|rc) ]]; then
            FLAGS=(--prerelease --latest=false)
          elif [ "$MAJOR" = "$((MASTER - 1))" ]; then
            FLAGS=(--prerelease=false --latest)
          else
            FLAGS=(--prerelease=false --latest=false)
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${FLAGS[@]}"
          echo "PUBLISH_FLAGS=${FLAGS[*]}" >> "$GITHUB_ENV"

      - name: Pointer release on nextcloud/server
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo nextcloud/server >/dev/null 2>&1; then
            echo "::notice::nextcloud/server already has release ${TAG}"
            exit 0
          fi
          # shellcheck disable=SC2086 # PUBLISH_FLAGS holds separate flags
          gh release create "$TAG" --repo nextcloud/server --verify-tag --title "$TAG" \
            --notes "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" $PUBLISH_FLAGS

  # The download server pulls published releases itself. Wait until it serves
  # the archive and the bytes are the ones built here, before the updater
  # server is told about the version.
  verify-download:
    needs: [preflight, publish]
    if: ${{ vars.PIPELINE_PUBLISHES == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {}
    steps:
      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: releases

      - name: Wait for download.nextcloud.com
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          if [[ "$VERSION" =~ (alpha|beta|rc) ]]; then DIR=prereleases; else DIR=releases; fi
          FILE="nextcloud-${VERSION}.tar.bz2"
          URL="https://download.nextcloud.com/server/${DIR}/${FILE}"
          EXPECTED=$(awk -v f="$FILE" '$2 == f { print $1 }' "releases/${FILE}.sha512")

          for _ in $(seq 40); do
            if curl -sfI "$URL" >/dev/null; then
              ACTUAL=$(curl -sfL "$URL" | sha512sum | cut -d' ' -f1)
              if [ "$ACTUAL" = "$EXPECTED" ]; then
                echo "::notice::${URL} is served and matches the build"
                exit 0
              fi
              echo "::error::${URL} is served but its sha512 is not the build's"
              exit 1
            fi
            sleep 60
          done
          echo "::error::${URL} still not served after 40 minutes"
          exit 1

  updater:
    needs: [preflight, build, verify-download]
    if: >-
      always() && needs.build.result == 'success'
      && (needs.verify-download.result == 'success' || needs.verify-download.result == 'skipped')
    uses: ./.github/workflows/release-updater.yml
    with:
      tag: ${{ needs.preflight.outputs.tag }}
    secrets: inherit

  # Runs after tagging a release candidate, roughly a week before the stable
  # release it precedes. Proposes the schedule entries that release will need,
  # as a pull request; never blocks the candidate.
  schedule:
    needs: [preflight, tag]
    if: contains(needs.preflight.outputs.tag, 'rc')
    uses: ./.github/workflows/release-schedule.yml
    secrets: inherit

  # Runs after tagging completes. Only for stable releases and first betas.
  # Runs in parallel with changelog and build.
  milestones:
    needs: [preflight, tag]
    if: >-
      (!contains(needs.preflight.outputs.tag, 'alpha') && !contains(needs.preflight.outputs.tag, 'beta') && !contains(needs.preflight.outputs.tag, 'rc'))
      || endsWith(needs.preflight.outputs.tag, 'beta1')
    uses: ./.github/workflows/release-milestones.yml
    with:
      tag: ${{ needs.preflight.outputs.tag }}
    secrets: inherit

  # Single pass/fail for the whole pipeline. Milestones and Schedule each skip
  # depending on the release shape, so a skip must not count as a failure.
  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [preflight, approve, cleanup, tag, draft, changelog, build, publish, verify-download, updater, schedule, milestones]

    if: always()

    name: release-summary

    steps:
      - name: Summary status
        run: if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then exit 1; fi

